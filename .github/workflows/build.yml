name: Build Sonify APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore (if configured in Secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Clean APK File
        id: apk
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || true)
          VER="${VER:-dev}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi

          mkdir -p release-out
          cp "$APK_FILE" "release-out/Sonify-v${VER}.apk"
          ls -lh release-out/

      - name: Upload APK Artifact (No ZIP Compression)
        uses: actions/upload-artifact@v4
        with:
          name: Sonify-APK
          path: release-out/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: Sonify v${{ steps.apk.outputs.version }} (Build #${{ github.run_number }})
          body: |
            Direct APK download (no ZIP extraction required).
            Commit: `${{ github.sha }}`
          files: release-out/*.apk
          make_latest: true
