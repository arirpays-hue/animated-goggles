name: Build Sonify APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-SonifyRelease2026!}"
          ALIAS="${KEY_ALIAS:-sonify}"
          KPASS="${KEY_PASSWORD:-$PASS}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Loaded keystore from GitHub Secrets."
          elif [ -f "app/release.keystore" ]; then
            echo "Using existing persistent app/release.keystore from repository."
          else
            echo "Generating new persistent signing keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -storetype PKCS12 \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$KPASS" \
              -dname "CN=Sonify, OU=Mobile, O=Sonify, L=IL, ST=IL, C=IL"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f app/release.keystore
            git commit -m "Add persistent signing keystore [skip ci]"
            git push || echo "Warning: could not push keystore back to repo."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Clean APK File
        id: apk
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]' || true)
          VER="${VER:-dev}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi

          mkdir -p release-out
          cp "$APK_FILE" "release-out/Sonify-v${VER}.apk"
          ls -lh release-out/

      - name: Upload APK Artifact (No ZIP Compression)
        uses: actions/upload-artifact@v4
        with:
          name: Sonify-APK
          path: release-out/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: Sonify v${{ steps.apk.outputs.version }} (Build #${{ github.run_number }})
          body: |
            Direct APK download (signed with persistent key for in-place updates).
            Commit: `${{ github.sha }}`
          files: release-out/*.apk
          make_latest: true
